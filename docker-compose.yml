version: "2.4"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leafledger
      POSTGRES_PASSWORD: leafledger
      POSTGRES_DB: leafledger
      TZ: Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leafledger -d leafledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    # build:
    #   context: ../leafledger_server
    #   dockerfile: Dockerfile
    image: leafledger_server:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://leafledger:leafledger@db:5432/leafledger
      # Override in `.env` or your shell; default is for local Docker only.
      JWT_SECRET: this-is-a-secret
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

  app:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: leaf_ledger:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
      SERVER_URL: http://server:4000
      # Override in `.env` or your shell; default is for local Docker only.
      JWT_SECRET: this-is-a-secret
    depends_on:
      server:
        condition: service_started

volumes:
  postgres_data:
