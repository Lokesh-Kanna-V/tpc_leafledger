services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leafledger
      POSTGRES_PASSWORD: leafledger
      POSTGRES_DB: leafledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leafledger -d leafledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: leafledger-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://leafledger:leafledger@db:5432/leafledger
      # Override in `.env` or your shell; default is for local Docker only.
      JWT_SECRET: ${JWT_SECRET:-leafledger-docker-dev-secret-replace-for-production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
